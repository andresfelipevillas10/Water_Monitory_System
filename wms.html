<body class="w-screen h-screen flex flex-col">

    <!-- ========================================================= -->
    <!-- FLOATING TOP SWITCHER & STANDALONE HTML DOWNLOADER        -->

    <!-- ========================================================= -->

        <!-- ===================================================== -->

        // Create LCD 1602 Canvas Texture
        function createLCDTexture() {
            lcdCanvas = document.createElement('canvas');
            lcdCanvas.width = 512;
            lcdCanvas.height = 192;
            lcdCtx = lcdCanvas.getContext('2d');
            lcdTexture = new THREE.CanvasTexture(lcdCanvas);
            lcdTexture.minFilter = THREE.LinearFilter;
            updateLCDCanvas(5.7, 24);
            return lcdTexture;
        }

        function updateLCDCanvas(dist, risk) {
            if (!lcdCtx) return;
            const grad = lcdCtx.createLinearGradient(0, 0, 512, 192);
            grad.addColorStop(0, '#0055ff');
            grad.addColorStop(0.5, '#0088ff');
            grad.addColorStop(1, '#0050ee');
            lcdCtx.fillStyle = grad;
            lcdCtx.fillRect(0, 0, 512, 192);

            lcdCtx.fillStyle = 'rgba(0, 25, 90, 0.22)';
            for (let r = 0; r < 2; r++) {
                for (let c = 0; c < 16; c++) {
                    lcdCtx.fillRect(24 + c * 28.5, 26 + r * 76, 24, 62);
                }
            }

            lcdCtx.save();
            lcdCtx.font = 'bold 46px "JetBrains Mono", monospace';
            lcdCtx.fillStyle = '#e0faff';
            lcdCtx.shadowColor = '#7dd3fc';
            lcdCtx.shadowBlur = 8;
            lcdCtx.fillText(`Dist: ${Number(dist).toFixed(1)} cm`, 26, 74);
            lcdCtx.fillText(`Riesgo: ${risk}%`, 26, 150);
            lcdCtx.restore();

            if (lcdTexture) lcdTexture.needsUpdate = true;
        }

        function createLDRTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 320;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#153e90';
            ctx.fillRect(0, 0, 256, 320);

            ctx.save();
            ctx.translate(42, 220);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 26px "Inter", sans-serif';
            ctx.fillText('Photoresistor', 0, 0);
            ctx.restore();

            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 3;
            ctx.strokeRect(85, 110, 86, 95);
            return new THREE.CanvasTexture(c);
        }

        function createCardboardTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#d2c4ac';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 5000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(60,45,30,0.04)';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
            }

            ctx.strokeStyle = 'rgba(50, 38, 24, 0.45)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(22, 0); ctx.lineTo(22, 512);
            ctx.moveTo(490, 0); ctx.lineTo(490, 512);
            ctx.stroke();

            return new THREE.CanvasTexture(c);
        }

        function createGlowSprite(hexColor, size = 2.5) {
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 60);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.25, hexColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);

            const mat = new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(c),
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(size, size, 1);
            return sprite;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            const w = container.clientWidth || 600;
            const h = container.clientHeight || 600;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // Subtle technical floor grid
            const gridHelper = new THREE.GridHelper(36, 36, 0x1e3a5f, 0x0f1f38);
            gridHelper.position.y = -7.2;
            scene.add(gridHelper);

            scene.add(new THREE.AmbientLight(0xdbeafe, 0.8));
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight1.position.set(15, 22, 18);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.35);
            dirLight2.position.set(-18, -10, -14);
            scene.add(dirLight2);

            wmsGroup = new THREE.Group();
            scene.add(wmsGroup);

            // 1. Cardboard Chassis Box
            const boxGeo = new THREE.BoxGeometry(12, 6.8, 6.4);
            boxMesh = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({
                map: createCardboardTexture(),
                roughness: 0.82,
                metalness: 0.05

            boxMesh.position.set(0, 1.5, 0);
            wmsGroup.add(boxMesh);

            boxMesh.add(new THREE.LineSegments(
                new THREE.EdgesGeometry(boxGeo),
                new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.45 })

            // Side Flaps
            const flapGeo = new THREE.BoxGeometry(0.18, 6.85, 6.48);
            const flapMat = new THREE.MeshStandardMaterial({ color: 0xb8a68a, roughness: 0.9 });
            const leftFlap = new THREE.Mesh(flapGeo, flapMat);
            leftFlap.position.set(-6.02, 0, 0);
            boxMesh.add(leftFlap);
            const rightFlap = new THREE.Mesh(flapGeo, flapMat);
            rightFlap.position.set(6.02, 0, 0);
            boxMesh.add(rightFlap);

            // 2. Front Face: LCD 1602
            frontLcdGroup = new THREE.Group();
            frontLcdGroup.position.set(0, 1.3, 3.22);
            wmsGroup.add(frontLcdGroup);

            frontLcdGroup.add(new THREE.Mesh(
                new THREE.BoxGeometry(8.1, 3.55, 0.15),
                new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 })
            ));

            const bezelMesh = new THREE.Mesh(
                new THREE.BoxGeometry(7.7, 3.2, 0.28),
                new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.4, metalness: 0.5 })
            );
            bezelMesh.position.z = 0.08;
            frontLcdGroup.add(bezelMesh);

            const screenMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(6.9, 2.35),
                new THREE.MeshBasicMaterial({ map: createLCDTexture() })
            );
            screenMesh.position.z = 0.23;
            frontLcdGroup.add(screenMesh);

            // 3. Top Modules: LDR (Left) + BMP180 (Right)
            topModulesGroup = new THREE.Group();
            topModulesGroup.position.set(0, 4.92, 0);
            wmsGroup.add(topModulesGroup);

            const ldrGroup = new THREE.Group();
            ldrGroup.position.set(-2.1, 0.08, 0.35);
            topModulesGroup.add(ldrGroup);

            ldrGroup.add(new THREE.Mesh(
                new THREE.BoxGeometry(2.1, 0.14, 2.7),
                new THREE.MeshStandardMaterial({ map: createLDRTexture(), roughness: 0.4 })
            ));

            const ldrHead = new THREE.Mesh(
                new THREE.CylinderGeometry(0.32, 0.32, 0.48, 24),
                new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3 })
            );
            ldrHead.position.set(0, 0.3, -0.3);
            ldrGroup.add(ldrHead);

            const ldrBlueLed = new THREE.Mesh(
                new THREE.SphereGeometry(0.14, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x00f0ff })
            );
            ldrBlueLed.position.set(0.42, 0.14, 0.15);
            ldrGroup.add(ldrBlueLed);

            const ldrBlueGlow = createGlowSprite('#00d8ff', 1.9);
            ldrBlueGlow.position.set(0.42, 0.25, 0.15);
            ldrGroup.add(ldrBlueGlow);

            // Black tape & 3 wires entering slot
            const ldrTape = new THREE.Mesh(
                new THREE.BoxGeometry(0.95, 0.28, 0.9),
                new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.9 })
            );
            ldrTape.position.set(0, 0.2, 1.05);
            ldrGroup.add(ldrTape);

            [0x1e293b, 0xef4444, 0x22c55e].forEach((col, idx) => {
                const offsetX = (idx - 1) * 0.22;
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(offsetX, 0.22, 1.35),
                    new THREE.Vector3(offsetX, 0.18, 1.85),
                    new THREE.Vector3(offsetX, -0.35, 1.95)
                ]);
                ldrGroup.add(new THREE.Mesh(
                    new THREE.TubeGeometry(curve, 16, 0.055, 8, false),
                    new THREE.MeshStandardMaterial({ color: col })
                ));
            });

            // BMP180 Right Module
            const bmpGroup = new THREE.Group();
            bmpGroup.position.set(2.4, 0.08, 0.15);
            topModulesGroup.add(bmpGroup);

            bmpGroup.add(new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 0.15, 2.5),
                new THREE.MeshStandardMaterial({ color: 0x17253b, roughness: 0.5 })
            ));

            const bmpHousing = new THREE.Mesh(
                new THREE.BoxGeometry(1.35, 0.32, 1.35),
                new THREE.MeshStandardMaterial({ color: 0x0f172a })
            );
            bmpHousing.position.set(-0.1, 0.22, 0);
            bmpGroup.add(bmpHousing);

            const orangeLed = new THREE.Mesh(
                new THREE.SphereGeometry(0.14, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff8800 })
            );

            const domeGroup = new THREE.Group();

            statusLedMesh = new THREE.MeshBasicMaterial({ color: 0x22c55e });
            const cylMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 0.55, 24), statusLedMesh);

            // 5. Bottom Face: HC-SR04 Ultrasonic + Water Container
            bottomSensorGroup = new THREE.Group();

            bottomSensorGroup.add(new THREE.Mesh(

            [-0.95, 0.95].forEach(xPos => {
                const cyl = new THREE.Mesh(

                cyl.position.set(xPos, -0.5, 0);
                bottomSensorGroup.add(cyl);

                const core = new THREE.Mesh(

            for (let i = 0; i < 3; i++) {
                const ring = new THREE.Mesh(

                ring.rotation.x = Math.PI / 2;
                bottomSensorGroup.add(ring);
                ultrasonicRings.push(ring);

            const tubGroup = new THREE.Group();
            tubGroup.position.set(0, -5.8, 0);

            const tubGeo = new THREE.BoxGeometry(10.5, 2.6, 7.2);

            })));

                new THREE.EdgesGeometry(tubGeo),

            waterMesh = new THREE.Mesh(
                new THREE.BoxGeometry(10.1, 1.8, 6.8),

            );
            waterMesh.position.y = -0.2;
            tubGroup.add(waterMesh);

            // 6. Left Side USB Cable + Internal ESP32
            usbCableGroup = new THREE.Group();
            usbCableGroup.position.set(-6.1, 2.2, 0);
            wmsGroup.add(usbCableGroup);

            const plugMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.95, 0.52, 0.85),
                new THREE.MeshStandardMaterial({ color: 0xf8fafc })
            );
            plugMesh.position.set(-0.4, 0, 0);
            usbCableGroup.add(plugMesh);

            const usbCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-0.8, 0, 0),
                new THREE.Vector3(-2.1, -0.3, 0),
                new THREE.Vector3(-2.8, -3.5, 0.2),
                new THREE.Vector3(-3.1, -7.2, 0.4)
            ]);
            usbCableGroup.add(new THREE.Mesh(
                new THREE.TubeGeometry(usbCurve, 32, 0.16, 12, false),
                new THREE.MeshStandardMaterial({ color: 0xf1f5f9 })
            ));

            // Internal ESP32 (Visible in X-Ray mode)
            interiorGroup = new THREE.Group();
            interiorGroup.position.set(-1.2, 0.6, -0.4);
            wmsGroup.add(interiorGroup);

            interiorGroup.add(new THREE.Mesh(
                new THREE.BoxGeometry(4.8, 0.18, 2.4),
                new THREE.MeshStandardMaterial({ color: 0x111827 })
            ));
            const espShield = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.28, 1.5),
                new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8 })
            );
            espShield.position.set(1.1, 0.2, 0);
            interiorGroup.add(espShield);

            setupInteractionEvents(container);
            window.addEventListener('resize', onWindowResize);
        }

        function setupInteractionEvents(container) {
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                autoRotate = false;
                updateAutoRotateUI();
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
                spherical.targetTheta -= dx * 0.0085;
                spherical.targetPhi = Math.max(0.15, Math.min(Math.PI - 0.15, spherical.targetPhi - dy * 0.0085));
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    autoRotate = false;
                    updateAutoRotateUI();
                    prevMouse.x = e.touches[0].clientX;
                    prevMouse.y = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - prevMouse.x;
                const dy = e.touches[0].clientY - prevMouse.y;
                prevMouse.x = e.touches[0].clientX;
                prevMouse.y = e.touches[0].clientY;
                spherical.targetTheta -= dx * 0.0085;
                spherical.targetPhi = Math.max(0.15, Math.min(Math.PI - 0.15, spherical.targetPhi - dy * 0.0085));
            }, { passive: true });

            window.addEventListener('touchend', () => { isDragging = false; });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                spherical.targetRadius = Math.max(13, Math.min(40, spherical.targetRadius + e.deltaY * 0.015));
            }, { passive: false });
        }

        function update3DPinsProjection() {
            const container = document.getElementById('canvas-container');
            if (!container || !camera || !showPins) return;
            const w = container.clientWidth;
            const h = container.clientHeight;

            Object.keys(PIN_DATA).forEach(id => {
                const pinEl = document.getElementById('pin-' + id);
                if (!pinEl) return;
                const worldPos = PIN_DATA[id].pos3D.clone();
                worldPos.project(camera);

                if (worldPos.z > 1) {
                    pinEl.style.display = 'none';
                } else {
                    const x = (worldPos.x * 0.5 + 0.5) * w;
                    const y = (-(worldPos.y * 0.5) + 0.5) * h;
                    pinEl.style.display = 'flex';
                    pinEl.style.left = `${x}px`;
                    pinEl.style.top = `${y}px`;
                }
            });
        }

        function selectPin(id) {
            const data = PIN_DATA[id];
            if (!data) return;
            document.querySelectorAll('.pin-3d').forEach(p => p.classList.remove('active'));
            const activePin = document.getElementById('pin-' + id);
            if (activePin) activePin.classList.add('active');

            document.getElementById('pin-title').textContent = data.title;
            document.getElementById('pin-badge').textContent = data.badge;
            document.getElementById('pin-desc').textContent = data.desc;

            if (id === 6 && !isXRay) toggleXRay();
            setCameraPreset(data.preset);
        }

        function togglePins() {
            showPins = !showPins;
            document.getElementById('pins-container').style.display = showPins ? 'block' : 'none';
            document.getElementById('pin-info-card').style.display = showPins ? 'block' : 'none';
            const btn = document.getElementById('btn-pins');
            btn.className = showPins
                ? 'px-2 py-1 rounded-lg text-[11px] font-medium bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition'
                : 'px-2 py-1 rounded-lg text-[11px] font-medium bg-slate-900 text-slate-400 border border-slate-800 transition';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && !isDragging) {
                spherical.targetTheta += 0.0035;
            }

            spherical.theta += (spherical.targetTheta - spherical.theta) * 0.09;
            spherical.phi += (spherical.targetPhi - spherical.phi) * 0.09;
            spherical.radius += (spherical.targetRadius - spherical.radius) * 0.09;
            cameraTarget.lerp(desiredCameraTarget, 0.09);

            if (camera) {
                camera.position.set(
                    cameraTarget.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta),
                    cameraTarget.y + spherical.radius * Math.cos(spherical.phi),
                    cameraTarget.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta)
                );
                camera.lookAt(cameraTarget);
            }

            const time = performance.now() * 0.002;
            ultrasonicRings.forEach((ring, i) => {
                const progress = (time + i * 0.33) % 1;
                ring.position.y = -1.1 - progress * 2.9;
                const scale = 0.7 + progress * 1.6;
                ring.scale.set(scale, scale, 1);
                ring.material.opacity = (1 - progress) * 0.65;
            });

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
                update3DPinsProjection();
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container || !renderer || !camera) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function updateSimulation(val) {
            const dist = parseFloat(val);
            const t = (dist - 5.7) / (13.9 - 5.7);
            const risk = Math.round(Math.max(15, Math.min(98, 24 + t * (89 - 24))));

            document.getElementById('hud-dist').textContent = `${dist.toFixed(1)} cm`;
            const riskEl = document.getElementById('hud-risk');
            riskEl.textContent = `${risk}%`;

            updateLCDCanvas(dist, risk);

            if (waterMesh) {
                const waterScaleY = Math.max(0.25, 1.35 - (dist - 5.0) * 0.1);
                waterMesh.scale.y = waterScaleY;
                waterMesh.position.y = -1.1 + waterScaleY * 0.85;
            }

            const isAlarm = risk >= 65;
            const dot = document.getElementById('status-dot');
            if (isAlarm) {
                statusLedMesh.color.setHex(0xff2a2a);
                statusLedLight.color.setHex(0xff2a2a);
                if (statusLedGlowSprite) statusLedGlowSprite.material.color.setHex(0xff3333);
                riskEl.className = 'text-rose-400';
                dot.className = 'w-2 h-2 rounded-full bg-rose-500 animate-ping';
            } else {
                statusLedMesh.color.setHex(0x22c55e);
                statusLedLight.color.setHex(0x22c55e);
                if (statusLedGlowSprite) statusLedGlowSprite.material.color.setHex(0x22c55e);
                riskEl.className = 'text-emerald-400';
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
            }
        }

        function setSimPreset(val) {
            document.getElementById('sim-slider').value = val;
            updateSimulation(val);
        }

        function setCameraPreset(preset) {
            autoRotate = false;
            updateAutoRotateUI();
            switch (preset) {
                case 'front':
                    spherical.targetTheta = 0; spherical.targetPhi = 1.48; spherical.targetRadius = 21;
                    desiredCameraTarget.set(0, 0.8, 0); break;
                case 'top':
                    spherical.targetTheta = 0.05; spherical.targetPhi = 0.35; spherical.targetRadius = 20;
                    desiredCameraTarget.set(0, 3.0, 0); break;
                case 'right':
                    spherical.targetTheta = 1.42; spherical.targetPhi = 1.38; spherical.targetRadius = 19;
                    desiredCameraTarget.set(2.5, 1.8, 0); break;
                case 'bottom':
                    spherical.targetTheta = 0.35; spherical.targetPhi = 2.05; spherical.targetRadius = 22;
                    desiredCameraTarget.set(0, -2.5, 0); break;
                default:
                    spherical.targetTheta = 0.52; spherical.targetPhi = 1.15; spherical.targetRadius = 25;
                    desiredCameraTarget.set(0, -0.5, 0);
            }
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            updateAutoRotateUI();
        }

        function updateAutoRotateUI() {
            const btn = document.getElementById('btn-autorotate');
            if (!btn) return;
            btn.className = autoRotate
                ? 'px-2.5 py-1 rounded-lg text-[11px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition'
                : 'px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-900 hover:bg-slate-800 text-slate-300 transition';
        }

        function toggleXRay() {
            isXRay = !isXRay;
            if (boxMesh) {
                boxMesh.material.transparent = isXRay;
                boxMesh.material.opacity = isXRay ? 0.22 : 1.0;
                boxMesh.material.needsUpdate = true;
            }
            const btn = document.getElementById('btn-xray');
            btn.className = isXRay
                ? 'px-2 py-1 rounded-lg text-[11px] font-medium bg-cyan-500/25 text-cyan-300 border border-cyan-500/40 transition'
                : 'px-2 py-1 rounded-lg text-[11px] font-medium bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 transition';
        }

        // =====================================================
        // LAYOUT MODE SWITCHER (3D+2D SPLIT | 3D ONLY | 2D ONLY)
        // =====================================================
        function setLayoutMode(mode) {
            const p3d = document.getElementById('panel-3d');
            const p2d = document.getElementById('panel-2d');
            const bSplit = document.getElementById('btn-mode-split');
            const b3d = document.getElementById('btn-mode-3d');
            const b2d = document.getElementById('btn-mode-2d');

            const activeCls = 'flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold transition bg-cyan-500 text-slate-950';
            const inactiveCls = 'flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-300 hover:text-white';

            if (bSplit) bSplit.className = mode === 'split' ? activeCls : inactiveCls;
            if (b3d) b3d.className = mode === '3d' ? activeCls : inactiveCls;
            if (b2d) b2d.className = mode === '2d' ? activeCls : inactiveCls;

            if (mode === '3d') {
                p3d.className = 'relative w-full h-full flex flex-col overflow-hidden';
                p2d.className = 'hidden';
            } else if (mode === '2d') {
                p3d.className = 'hidden';
                p2d.className = 'relative w-full h-full bg-[#071324] flex flex-col items-center justify-center overflow-hidden p-2 sm:p-6';
            } else {
                p3d.className = 'relative w-full lg:w-1/2 h-1/2 lg:h-full border-b lg:border-b-0 lg:border-r border-slate-800/80 flex flex-col overflow-hidden';
                p2d.className = 'relative w-full lg:w-1/2 h-1/2 lg:h-full bg-[#071324] flex flex-col items-center justify-center overflow-hidden p-2 sm:p-4';
            }
            setTimeout(onWindowResize, 50);
        }

        // =====================================================
        // 2D BLUEPRINT THEME & EXPORT FUNCTIONS
        // =====================================================
        function toggleBlueprintTheme() {
            isBlueprintLight = !isBlueprintLight;
            const svg = document.getElementById('wms-blueprint-svg');
            const panel2d = document.getElementById('panel-2d');
            if (isBlueprintLight) {
                svg.classList.remove('bp-dark');
                svg.classList.add('bp-light');
                panel2d.style.backgroundColor = '#f1f5f9';
            } else {
                svg.classList.remove('bp-light');
                svg.classList.add('bp-dark');
                panel2d.style.backgroundColor = '#071324';
            }
        }

        function capture3DScreenshot() {
            if (!renderer) return;
            renderer.render(scene, camera);
            const a = document.createElement('a');
            a.download = 'wms-3d.png';
            a.href = renderer.domElement.toDataURL('image/png');
            a.click();
        }

        function downloadBlueprintSVG() {
            const svgEl = document.getElementById('wms-blueprint-svg');
            const source = new XMLSerializer().serializeToString(svgEl);
            const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'wms-plano-2d.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadBlueprintPNG() {
            const svgEl = document.getElementById('wms-blueprint-svg');
            const svgString = new XMLSerializer().serializeToString(svgEl);
            const url = URL.createObjectURL(new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }));
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = 2800;
                canvas.height = 1700;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'wms-plano-2d.png';
                a.click();
            };
            img.src = url;
        }

        // =====================================================
        // 1-CLICK STANDALONE HTML GENERATOR (wms-3d.html / wms-2d.html)
        // =====================================================
        function downloadStandaloneFile(targetMode) {
            const docClone = document.documentElement.cloneNode(true);
            // Remove the top switcher bar so the downloaded file is 100% pure embed
            const switcher = docClone.querySelector('#top-switcher');
            if (switcher) switcher.remove();

            // Clear dynamic canvas children before serializing
            const canvasCont = docClone.querySelector('#canvas-container');
            if (canvasCont) canvasCont.innerHTML = '';

            // Inject standalone mode flag at the top of head
            const configScript = document.createElement('script');
            configScript.textContent = `window.STANDALONE_MODE = "${targetMode}";`;
            docClone.querySelector('head').prepend(configScript);

            const htmlContent = '<!DOCTYPE html>\n' + docClone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = targetMode === '3d' ? 'wms-3d.html' : 'wms-2d.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = function () {
            if (isEmbed) {
                const switcher = document.getElementById('top-switcher');
                if (switcher) switcher.style.display = 'none';
            }
            init3D();
            if (forcedMode === '3d' || forcedMode === '2d') {
                setLayoutMode(forcedMode);
            } else {
                setLayoutMode('split');
            }
            animate();
        };
